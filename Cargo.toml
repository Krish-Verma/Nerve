[workspace]
resolver = "2"
members = [
    "crates/nerve-core",
    "crates/nerve-store",
    "crates/nerve-index",
    "crates/nerve-server",
    "crates/nerve-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krishverma/nerve"

[workspace.dependencies]
nerve-core = { path = "crates/nerve-core" }
nerve-store = { path = "crates/nerve-store" }
nerve-index = { path = "crates/nerve-index" }
nerve-server = { path = "crates/nerve-server" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
# `default-features = false` plus an explicit `rust_backend` is load-bearing, not tidiness:
# every other backend flate2 offers (`zlib`, `zlib-ng`, `cloudflare_zlib`, `libz-sys`) is a C
# library with a build script. `rust_backend` is `miniz_oxide`, which is pure Rust. Asserted by
# `crates/nerve-index/tests/gitobj.rs::the_inflate_backend_is_pure_rust`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ignore = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
tiny_http = { version = "0.12", default-features = false }
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
